[package]
name = "video-player"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37", features = ["image", "file"] }
image = { version = "0.25.10", features = ["jpeg", "png", "webp", "gif"] }
nucleo-matcher = "0.3.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
ureq = "3.5.0"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v7"] }
walkdir = "2.5.0"

[profile.release]
opt-level = 3
strip = true
